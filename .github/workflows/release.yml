name: Build & Attest Prebuilts

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries
        run: |
          mkdir -p build/linux-${{ matrix.arch }}
          for bin in quranproxyd quranctl; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
              go build -trimpath -ldflags="-s -w" \
              -o build/linux-${{ matrix.arch }}/$bin ./cmd/$bin
          done

      # Package the exact layout install.sh expects: linux-<arch>/<binaries>.
      - name: Package archive
        run: |
          mkdir -p dist
          tar -czf dist/linux-${{ matrix.arch }}.tar.gz \
            -C build linux-${{ matrix.arch }}
          sha256sum dist/linux-${{ matrix.arch }}.tar.gz

      # Provenance is bound to the archive that users actually download.
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/linux-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      # Printed into the run log so the digests published in the release can be
      # cross-checked against checksums/<tag>.sha256 committed in the tree.
      - name: Publish digests to run log
        run: sha256sum artifacts/linux-*.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/linux-*.tar.gz
          generate_release_notes: true
